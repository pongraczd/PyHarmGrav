[build-system]
requires = ["setuptools>=64", "wheel", "numpy>=1.20"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyharmgrav"]

[tool.setuptools.package-data]
pyharmgrav = ["PREM-LLNs.dat", "pyharmgrav.png"]

[project]
name = "pyharmgrav"
version = "0.3.0"
dependencies = [
    "numpy",
    "pyharm>=0.4.9",
    "scipy",
    "h5py",
    "rasterio",
    "threadpoolctl",
    "xarray",
    "rioxarray",
    "netCDF4",
    "PyQt5",
]

[project.optional-dependencies]
notebooks = ["matplotlib", "cartopy"]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.scripts]
pyharmgrav = "pyharmgrav.pyharm_grav_cli:main"
[project.gui-scripts]
pyharmgrav_gui = "pyharmgrav.pyharmgrav_GUI:main"
