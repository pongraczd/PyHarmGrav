[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyharmgrav"]

[project]
name = "pyharmgrav"
version = "0.1"
dependencies = ["numpy","pyharm>=0.4.9","xarray","rioxarray","scipy","h5py","PyQt5","netCDF4"]
[project.scripts]
pyharmgrav = "pyharmgrav.pyharm_grav_cli:main"
[project.gui-scripts]
pyharmgrav_gui = "pyharmgrav.pyharmgrav_GUI:main"